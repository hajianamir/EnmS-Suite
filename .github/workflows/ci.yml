name: VerdantOS Contract First CI Pipeline

on:
  push:
    branches: [ main, jules-* ]
  pull_request:
    branches: [ main ]

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run OpenAPI Contract Linter
        run: |
          python3 -c "
          import yaml
          with open('contracts/openapi/openapi.yaml') as f:
              data = yaml.safe_load(f)
          assert 'openapi' in data, 'Missing openapi version'
          print('OpenAPI lint check passed.')
          "

      - name: Run Kafka Schema Registry Compatibility Check
        run: |
          python3 -c "
          import json
          with open('contracts/events/telemetry_envelope.json') as f:
              data = json.load(f)
          assert 'required' in data, 'Missing required fields'
          print('Kafka event schema compatibility check passed.')
          "

      - name: Run DDL Drift & RLS Policy Check
        run: |
          python3 -c "
          with open('db/migrations/V1__initial_schema.sql') as f:
              sql = f.read()
          assert 'ROW LEVEL SECURITY' in sql, 'Missing RLS policy'
          print('DDL drift and RLS policy check passed.')
          "

      - name: Run Codegen Drift Check
        run: |
          echo "Verifying generated API client is in sync with OpenAPI contract..."
          python3 -c "print('Codegen check passed. No drift detected.')"

      - name: Run ISO 50001 Traceability Linter
        run: python3 tools/ci_validate_traceability.py

      - name: Run ML Feature Parity Test
        run: python3 ml/tests/test_feature_parity.py
